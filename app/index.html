<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doom</title>
<style>
  /* The note's own page around the game: its background, its title at the top, the game below it
     as big as the note allows. The colours are the note's (--pinto-*, light and dark), with
     fallbacks for a plain browser. */
  html, body { margin: 0; height: 100%; }
  body { background: var(--pinto-bg, #fff); color: var(--pinto-text, #1d1d1f);
         font: 14px var(--pinto-font, -apple-system, system-ui, sans-serif); overflow: hidden;
         -webkit-user-select: none; user-select: none; }
  main { box-sizing: border-box; height: 100%; display: flex; flex-direction: column;
         padding: 8px var(--pinto-gutter, 24px) 14px; }
  h1 { font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; margin: 6px 0 14px;
       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: flex-start; }
  #screen { width: 100%; max-width: 1600px; aspect-ratio: 4 / 3; max-height: calc(100% - 26px);
            image-rendering: pixelated; background: #000; outline: none; display: block;
            border-radius: var(--pinto-radius-small, 8px); }
  @supports (width: 1cqw) {
    #stage { container-type: size; }
    #screen { width: min(100cqw, calc((100cqh - 26px) * 4 / 3)); max-height: none; }
  }
  #status { min-height: 18px; margin: 8px 0 0; font-size: 12px; color: var(--pinto-text-secondary, #86868b);
            transition: opacity 0.6s ease; }
  #status.gone { opacity: 0; }
</style>
</head>
<body>
<main>
  <h1 id="title">Doom</h1>
  <div id="stage">
    <canvas id="screen" width="320" height="200" tabindex="0" aria-label="Doom"></canvas>
    <p id="status">Loading Doom…</p>
  </div>
</main>
<script src="doom.js"></script>
<script src="main.js"></script>
<script src="touch.js"></script>
</body>
</html>
